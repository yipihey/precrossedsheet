[package]
name = "hcc-core"
version = "0.7.0"
edition = "2021"
description = "Pre-shell-crossing phase-space sheet cosmology laboratory; derived from Hopf–Cole cosmology"
license = "MIT"
repository = "https://github.com/yipihey/precrossedsheet"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustfft = "6.4"
num-complex = "0.4"
wasm-bindgen = "=0.2.122"
js-sys = "0.3"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 2
